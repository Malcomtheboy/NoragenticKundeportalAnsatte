<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Noragentic – Innlogging (Ansatt)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">N</div>
      <h1>Ansattportal</h1>
      <p class="auth-sub">
        Logg inn for å få tilgang til prosjekter, kommunikasjon og administrasjon.
      </p>

      <form id="loginForm" class="auth-form">
        <label class="auth-field">
          <span>E-post</span>
          <input id="email" type="email" placeholder="navn@noragentic.no" autocomplete="email" required />
        </label>

        <label class="auth-field">
          <span>Passord</span>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </label>

        <button class="btn primary" type="submit">Logg inn</button>
        <p class="auth-hint" id="hint"></p>
      </form>

      <div class="auth-footer">
        Innloggingen er foreløpig satt opp som frontend-flyt og kan senere kobles til Firebase Authentication.
      </div>
    </div>
  </main>

    <script type="module" src="employee-login.js"></script>
</body>
</html>
