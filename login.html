<!DOCTYPE html>
<html lang="no">
<head>

  <!-- Setter tegnsett til UTF-8 -->
  <meta charset="UTF-8" />

  <!-- Sørger for responsivt design på mobil og mindre skjermer -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Tittel som vises i nettleserfanen -->
  <title>Noragentic – Innlogging (Ansatt)</title>

  <!-- Kobler til hovedstylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Bakgrunnselement brukt til visuell styling -->
  <div class="bg"></div>

  <!-- Wrapper for sentrering av login-kort -->
  <main class="auth-wrap">

    <!-- Selve login-kortet -->
    <div class="auth-card">

      <!-- Enkel Noragentic-logo -->
    <img src="White Noragentic Logo.png" alt="NorAgentic logo" class="logo">

      <!-- Overskrift -->
      <h1>Ansattportal</h1>

      <!-- Kort forklaring til brukeren -->
      <p class="auth-sub">
        Logg inn for å få tilgang til prosjekter, kommunikasjon og administrasjon.
      </p>

      <!-- Login-skjema -->
      <form id="loginForm" class="auth-form">

        <!-- Inputfelt for e-post -->
        <label class="auth-field">
          <span>E-post</span>

          <input
            id="email"
            type="email"
            placeholder="navn@noragentic.no"
            autocomplete="email"
            required
          />
        </label>

        <!-- Inputfelt for passord -->
        <label class="auth-field">
          <span>Passord</span>

          <input
            id="password"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </label>

        <!-- Knapp for å logge inn -->
        <button class="btn primary" type="submit">
          Logg inn
        </button>

        <!-- Felt for feilmeldinger og statusmeldinger -->
        <p class="auth-hint" id="hint"></p>

      </form>

    </div>
  </main>

  <!-- Kobler login-siden til JavaScript-filen for autentisering -->
  <script type="module" src="employee-login.js"></script>

</body>
</html>
